# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# App Hosting runs your Next.js server (API routes, SSR, middleware) on Cloud
# Run. Env vars below are split into two kinds:
#   - value:  plain, safe-to-commit values (public config)
#   - secret: references to Cloud Secret Manager (set via the CLI — see SETUP)
#
# NEXT_PUBLIC_* vars must be available at BUILD (they're inlined into the
# browser bundle). Server-only secrets are RUNTIME.

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # ---- Public Firebase config (safe to commit) ----
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_YOUR_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: verdict-vault-30a1e.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: verdict-vault-30a1e
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: verdict-vault-30a1e.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_WITH_YOUR_SENDER_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_WITH_YOUR_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: REPLACE_WITH_YOUR_LIVE_URL
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ADMIN_WHATSAPP
    value: REPLACE_WITH_YOUR_WHATSAPP_DIGITS
    availability: [BUILD, RUNTIME]

  # ---- Server-only secrets (from Cloud Secret Manager) ----
  # Create each with:  firebase apphosting:secrets:set <NAME>
  - variable: FIREBASE_PROJECT_ID
    value: verdict-vault-30a1e
    availability: [RUNTIME]
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: ADMIN_NOTIFY_EMAIL
    secret: ADMIN_NOTIFY_EMAIL
  - variable: RESEND_FROM_EMAIL
    value: Verdict Vault <onboarding@resend.dev>
    availability: [RUNTIME]